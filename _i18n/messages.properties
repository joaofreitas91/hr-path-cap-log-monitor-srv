LINK_ALREADY_EXISTS=Este vínculo já existe.
INVALID_PERIOD=Período inválido: informe "from" e "to", com "from" menor ou igual a "to".
NOTIFICATION_RECIPIENT_REQUIRED=Informe um usuário ou um grupo de acesso como destinatário da notificação.
NOTIFICATION_RECIPIENT_AMBIGUOUS=Informe apenas um destinatário por notificação: usuário ou grupo de acesso.
NOTIFICATION_GROUP_WITHOUT_ACCESS=O grupo de acesso informado não tem acesso a esta integração.
REPROCESS_NOT_ENABLED=O reprocessamento não está habilitado para esta integração.
REPROCESS_NOT_CONFIGURED=O reprocessamento desta integração está incompleto: informe a destination, a Trigger URL e o campo personalizado.
REPROCESS_FIELD_WITHOUT_VALUE=Seleção inválida para reprocessamento: cada registro deve informar um valor no campo "{0}".
REPROCESS_TRIGGER_FAILED=Não foi possível acionar o reprocessamento ({0}): {1}
FIELD_USED_FOR_REPROCESSING=Este campo é usado no reprocessamento desta integração. Altere a configuração de reprocessamento antes de excluí-lo.
REPROCESS_FIELD_OTHER_INTEGRATION=O campo personalizado escolhido para o reprocessamento não pertence a esta integração.
